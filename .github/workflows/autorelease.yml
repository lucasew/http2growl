name: CI and Autorelease

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libnotify-dev

      - name: Install dependencies
        run: mise run install

      - name: Codegen
        run: mise run codegen

      - name: PR if Difference
        run: |
          if [[ -n $(git status -s) ]]; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git checkout -B "chore/codegen-update-${GITHUB_SHA::7}"
            git add -A
            git commit -m "chore: update codegen artifacts"
            git push origin "chore/codegen-update-${GITHUB_SHA::7}"
            gh pr create --title "chore: update codegen artifacts" --body "Autogenerated PR for codegen updates" --base main --head "chore/codegen-update-${GITHUB_SHA::7}"
          else
            echo "No changes after codegen"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI
        run: mise run ci

      - name: Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: ./
