[tools]
"ubi:lucasew/workspaced" = "0.1.6"
go = "1.24.3"

[tasks.lint]
run = "workspaced codebase lint"

[tasks.fmt]
run = "workspaced codebase format"

[tasks.test]
depends = ["test:*"]

[tasks."test:go"]
run = "go test ./..."

[tasks.codegen]
depends = ["codegen:*"]

[tasks."codegen:go"]
run = "echo 'No codegen for Go'"

[tasks.install]
depends = ["install:*"]

[tasks."install:go"]
run = "go mod download"

[tasks.ci]
depends = ["lint", "test"]
